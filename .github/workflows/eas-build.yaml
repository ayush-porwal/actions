name: eas-build

# Reusable EAS build. Submits the build to EAS and exits immediately
# (`--no-wait`) — the runner does NOT idle while EAS queues/builds. Grab
# the finished binary from the EAS dashboard (expo.dev → Builds).
#
# Per-environment values live in the chosen eas.json profile (its `env`).
# If the app reads a gitignored config file, the caller can drop one in
# before the build via `config-artifact` (it's extracted into
# <working-directory>/config/).
#
# Setup: add an EXPO_TOKEN repo secret (expo.dev → access tokens).

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory holding the Expo app."
        required: false
        type: string
        default: "mobile"
      node-version:
        description: "Node.js version to use."
        required: false
        type: string
        default: "24.x"
      platform:
        description: "EAS platform: android | ios."
        required: false
        type: string
        default: "android"
      profile:
        description: "EAS build profile (from eas.json); its `env` block carries per-environment values."
        required: false
        type: string
        default: "production"
      config-artifact:
        description: "Optional artifact whose contents are extracted into <working-directory>/config/ before building."
        required: false
        type: string
        default: ""
    secrets:
      EXPO_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: EAS build (${{ inputs.platform }}/${{ inputs.profile }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Download env config
        if: inputs.config-artifact != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.config-artifact }}
          path: ${{ inputs.working-directory }}/config

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Submit and exit (`--no-wait`): the runner doesn't idle through the
      # EAS queue/build. Collect the APK from the EAS dashboard.
      - name: Build
        env:
          # Build from the working dir as-is (incl. files the app needs that
          # are .gitignore'd, e.g. a generated config) instead of a clean git
          # archive.
          EAS_NO_VCS: "1"
          # Root the upload at the app dir, not the git repo root. eas-cli
          # otherwise resolves the project root via `git rev-parse
          # --show-toplevel`, which in a monorepo uploads the whole repo and
          # applies the repo-root ignore files. Pinning the root keeps the
          # upload to the app and lets <working-directory>/.gitignore (or
          # .easignore, if present) govern what ships.
          EAS_PROJECT_ROOT: ${{ github.workspace }}/${{ inputs.working-directory }}
        run: |
          eas build \
            --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --no-wait
