name: eas-build

# Reusable EAS build. Submits the build to EAS and exits immediately
# (`--no-wait`) — the runner does NOT idle while EAS queues/builds. Grab
# the finished binary from the EAS dashboard (expo.dev → Builds).
#
# Per-environment values live in the chosen eas.json profile (its `env`).
# If the app reads a gitignored config file, the caller can drop one in
# before the build via `config-artifact` (it's extracted into
# <config-directory>/).
#
# Install paths and EAS upload root are caller-provided for monorepos.
# Setup: add an EXPO_TOKEN repo secret (expo.dev → access tokens).

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory holding the Expo app (where `eas build` runs)."
        required: false
        type: string
        default: "mobile"
      install-directory:
        description: "Where to run npm ci. Leave empty to use working-directory."
        required: false
        type: string
        default: ""
      lockfile-path:
        description: "Lockfile for the npm cache key. Leave empty to use `<install-directory>/package-lock.json`."
        required: false
        type: string
        default: ""
      eas-project-root:
        description: "What EAS uploads. Default is `<repo>/<working-directory>`; set to the monorepo root when deps come from the root lockfile."
        required: false
        type: string
        default: ""
      config-directory:
        description: "Where to extract config-artifact before build (repo-relative path)."
        required: false
        type: string
        default: ""
      node-version:
        description: "Node.js version to use."
        required: false
        type: string
        default: "24.x"
      platform:
        description: "EAS platform: android | ios."
        required: false
        type: string
        default: "android"
      profile:
        description: "EAS build profile (from eas.json); its `env` block carries per-environment values."
        required: false
        type: string
        default: "production"
      config-artifact:
        description: "Optional artifact whose contents are extracted into `config-directory` before building."
        required: false
        type: string
        default: ""
    secrets:
      EXPO_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: EAS build (${{ inputs.platform }}/${{ inputs.profile }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.lockfile-path != '' && inputs.lockfile-path || concat(inputs.install-directory != '' && inputs.install-directory || inputs.working-directory, '/package-lock.json') }}

      - name: Install
        working-directory: ${{ inputs.install-directory != '' && inputs.install-directory || inputs.working-directory }}
        run: npm ci

      - name: Download env config
        if: inputs.config-artifact != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.config-artifact }}
          path: ${{ inputs.config-directory != '' && inputs.config-directory || concat(inputs.working-directory, '/config') }}

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        env:
          # Ship the working tree (incl. gitignored config), not a clean git archive.
          EAS_NO_VCS: "1"
          # Monorepos: pin upload root so eas-cli doesn't walk up to the repo top and ignore mobile/.easignore.
          EAS_PROJECT_ROOT: ${{ inputs.eas-project-root != '' && inputs.eas-project-root || concat(github.workspace, '/', inputs.working-directory) }}
        run: |
          # --no-wait: submit and exit; collect the binary from expo.dev when the queue finishes.
          eas build \
            --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --no-wait
