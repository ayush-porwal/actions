name: eas-build

# Reusable EAS build. Submits the build to EAS and exits immediately
# (`--no-wait`) — the runner does NOT idle while EAS queues/builds. Grab
# the finished APK from the EAS dashboard (expo.dev → Builds: install
# link / QR / .apk download).
#
# The app reads `mobile/config/{SMARAN_ENV}.json` at build time
# (mobile/app.config.ts). SMARAN_ENV comes from the eas.json build
# profile's `env`; that gitignored config file is dropped in via
# `config-artifact` before the build (the caller fetches it from the
# deployed stack's outputs).
#
# Setup: add an EXPO_TOKEN repo secret (expo.dev → access tokens).

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory holding the Expo app."
        required: false
        type: string
        default: "mobile"
      node-version:
        description: "Node.js version to use."
        required: false
        type: string
        default: "24.x"
      platform:
        description: "EAS platform: android | ios."
        required: false
        type: string
        default: "android"
      profile:
        description: "EAS build profile (from eas.json). The profile's env sets SMARAN_ENV, which selects mobile/config/{env}.json."
        required: false
        type: string
        default: "production"
      config-artifact:
        description: "Artifact name holding the {env}.json to drop into the app's config/ dir before building."
        required: false
        type: string
        default: ""
    secrets:
      EXPO_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: EAS build (${{ inputs.platform }}/${{ inputs.profile }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Download env config
        if: inputs.config-artifact != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.config-artifact }}
          path: ${{ inputs.working-directory }}/config

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Submit and exit (`--no-wait`): the runner doesn't idle through the
      # EAS queue/build. Collect the APK from the EAS dashboard.
      - name: Build
        env:
          # Build the working dir as-is (incl. the gitignored config file)
          # instead of from a clean git archive.
          EAS_NO_VCS: "1"
        run: |
          eas build \
            --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --no-wait
