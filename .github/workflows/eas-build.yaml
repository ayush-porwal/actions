name: eas-build

# Reusable EAS build. Submits the build to EAS and exits immediately
# (`--no-wait`) — the runner does NOT idle while EAS queues/builds. Grab
# the finished binary from the EAS dashboard (expo.dev → Builds).
#
# Per-environment values live in the chosen eas.json profile (its `env`).
# If the app reads a gitignored config file, the caller can drop one in
# before the build via `config-artifact` (it's extracted into
# <config-directory>/).
#
# Install paths and EAS upload root are caller-provided for monorepos.
# Setup: add an EXPO_TOKEN repo secret (expo.dev → access tokens).

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory holding the Expo app (where `eas build` runs)."
        required: false
        type: string
        default: "mobile"
      install-directory:
        description: "Directory to run `npm ci` in. Defaults to `working-directory` when empty."
        required: false
        type: string
        default: ""
      lockfile-path:
        description: "Lockfile path for npm cache. Defaults to `<install-directory>/package-lock.json` when empty."
        required: false
        type: string
        default: ""
      eas-project-root:
        description: "EAS upload root. Defaults to `<github.workspace>/<working-directory>`. Set to the monorepo root when workspace deps must resolve from the root lockfile."
        required: false
        type: string
        default: ""
      config-directory:
        description: "Directory where `config-artifact` contents are extracted (relative to repo root)."
        required: false
        type: string
        default: ""
      node-version:
        description: "Node.js version to use."
        required: false
        type: string
        default: "24.x"
      platform:
        description: "EAS platform: android | ios."
        required: false
        type: string
        default: "android"
      profile:
        description: "EAS build profile (from eas.json); its `env` block carries per-environment values."
        required: false
        type: string
        default: "production"
      config-artifact:
        description: "Optional artifact whose contents are extracted into `config-directory` before building."
        required: false
        type: string
        default: ""
    secrets:
      EXPO_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: EAS build (${{ inputs.platform }}/${{ inputs.profile }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.lockfile-path != '' && inputs.lockfile-path || concat(inputs.install-directory != '' && inputs.install-directory || inputs.working-directory, '/package-lock.json') }}

      - name: Install
        working-directory: ${{ inputs.install-directory != '' && inputs.install-directory || inputs.working-directory }}
        run: npm ci

      - name: Download env config
        if: inputs.config-artifact != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.config-artifact }}
          path: ${{ inputs.config-directory != '' && inputs.config-directory || concat(inputs.working-directory, '/config') }}

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Submit and exit (`--no-wait`): the runner doesn't idle through the
      # EAS queue/build. Collect the APK from the EAS dashboard.
      - name: Build
        working-directory: ${{ inputs.working-directory }}
        env:
          EAS_NO_VCS: "1"
          EAS_PROJECT_ROOT: ${{ inputs.eas-project-root != '' && inputs.eas-project-root || concat(github.workspace, '/', inputs.working-directory) }}
        run: |
          eas build \
            --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --no-wait
