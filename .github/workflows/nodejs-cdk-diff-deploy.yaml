name: nodejs-cdk-diff-deploy

# Reusable `cdk diff` → job summary → `cdk deploy` in a single job (one
# checkout + install). For environments without an approval gate between
# plan and apply (e.g. per-PR sandboxes). Staging/prod should keep
# separate diff/deploy workflows so reviewers read the plan first.
#
# Install paths are caller-provided for standalone apps and monorepos.

on:
  workflow_call:
    inputs:
      aws_role:
        description: "OIDC role in the infra/trust account. CDK chain-assumes bootstrap roles in the target account."
        required: true
        type: string
      aws_region:
        description: "AWS region."
        required: false
        type: string
        default: "eu-central-1"
      stack_name:
        description: "Exact CDK stack name."
        required: true
        type: string
      environment:
        description: "GitHub environment on the job — use for sandbox even when diff and deploy aren't separately gated."
        required: true
        type: string
      stack_prefix:
        description: "Value for CDK_STACK_PREFIX (e.g. 'pr42-')."
        required: false
        type: string
        default: ""
      outputs-artifact:
        description: "If set, upload cdk-outputs.json under this artifact name."
        required: false
        type: string
        default: ""
      working-directory:
        description: "Directory for CDK commands."
        required: false
        type: string
        default: "."
      install-directory:
        description: "Where to run npm ci. Leave empty to use working-directory."
        required: false
        type: string
        default: ""
      lockfile-path:
        description: "Lockfile for the npm cache key. Leave empty to use `<install-directory>/package-lock.json`."
        required: false
        type: string
        default: ""
      node-version:
        description: "Node.js version to use."
        required: false
        type: string
        default: "24.x"

permissions:
  contents: read
  id-token: write

jobs:
  diff_deploy:
    name: cdk diff + deploy ${{ inputs.stack_name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws_role }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: cdk-diff-deploy-${{ github.run_id }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.lockfile-path != '' && inputs.lockfile-path || (inputs.install-directory != '' && inputs.install-directory || inputs.working-directory) }}/package-lock.json

      - name: Install
        working-directory: ${{ inputs.install-directory != '' && inputs.install-directory || inputs.working-directory }}
        run: npm ci

      - name: Diff
        working-directory: ${{ inputs.working-directory }}
        env:
          CDK_STACK_PREFIX: ${{ inputs.stack_prefix }}
          STACK_NAME: ${{ inputs.stack_name }}
        run: |
          npx cdk diff "$STACK_NAME" --no-color --progress=events 2>&1 | tee cdk.log

          # Same summary trim as nodejs-cdk-diff — drop boilerplate above the stack header.
          {
            echo "## CDK Diff $STACK_NAME"
            echo ''
            echo '```'
            sed -n "/Stack ${STACK_NAME}\$/,\$p" cdk.log | sed '1d'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy
        # Same job as diff — intentional for ungated envs (one install, no waiting between plan and apply).
        working-directory: ${{ inputs.working-directory }}
        env:
          CDK_STACK_PREFIX: ${{ inputs.stack_prefix }}
          STACK_NAME: ${{ inputs.stack_name }}
        run: |
          npx cdk deploy "$STACK_NAME" \
            --require-approval never \
            --outputs-file cdk-outputs.json

      - name: Expose outputs
        if: success()
        working-directory: ${{ inputs.working-directory }}
        env:
          STACK_NAME: ${{ inputs.stack_name }}
        run: |
          if [ -f cdk-outputs.json ]; then
            {
              echo "## Outputs — $STACK_NAME"
              echo ''
              echo '```json'
              cat cdk-outputs.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload outputs artifact
        if: success() && inputs.outputs-artifact != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.outputs-artifact }}
          path: ${{ inputs.working-directory }}/cdk-outputs.json
          if-no-files-found: error
          retention-days: 7
