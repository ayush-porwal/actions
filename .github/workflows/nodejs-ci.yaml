name: nodejs-ci

# Reusable typecheck/lint for a plain Node package (e.g. an Expo app).
# Checks are toggled by input. Install paths and an optional npm
# workspace name are caller-provided — nothing assumes a fixed layout.

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Package directory when not using npm workspaces (ignored for script commands if npm-workspace is set)."
        required: false
        type: string
        default: "."
      install-directory:
        description: "Where to run npm ci. Leave empty to use working-directory."
        required: false
        type: string
        default: ""
      lockfile-path:
        description: "Lockfile for the npm cache key. Leave empty to use `<install-directory>/package-lock.json`."
        required: false
        type: string
        default: ""
      npm-workspace:
        description: "Optional npm workspace name. When set, scripts run as `npm run <script> --workspace=<name>`."
        required: false
        type: string
        default: ""
      node-version:
        description: "Node.js version to use."
        required: false
        type: string
        default: "24.x"
      typecheck:
        description: "Run `npm run typecheck` (via workspace flag when npm-workspace is set)."
        required: false
        type: boolean
        default: true
      lint:
        description: "Run `npm run lint`."
        required: false
        type: boolean
        default: true
      format-check:
        description: "Run `npm run format:check` (typically from the monorepo root)."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: typecheck, lint
    runs-on: ubuntu-latest
    env:
      NPM_WORKSPACE: ${{ inputs.npm-workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.lockfile-path != '' && inputs.lockfile-path || concat(inputs.install-directory != '' && inputs.install-directory || inputs.working-directory, '/package-lock.json') }}

      - name: Install
        working-directory: ${{ inputs.install-directory != '' && inputs.install-directory || inputs.working-directory }}
        run: npm ci

      - name: Format check
        if: inputs.format-check
        working-directory: ${{ inputs.install-directory != '' && inputs.install-directory || inputs.working-directory }}
        run: npm run format:check

      - name: Typecheck
        if: inputs.typecheck
        working-directory: ${{ inputs.install-directory != '' && inputs.install-directory || inputs.working-directory }}
        run: |
          if [ -n "$NPM_WORKSPACE" ]; then
            npm run typecheck --workspace="$NPM_WORKSPACE"
          else
            npm run typecheck
          fi

      - name: Lint
        if: inputs.lint
        working-directory: ${{ inputs.install-directory != '' && inputs.install-directory || inputs.working-directory }}
        run: |
          if [ -n "$NPM_WORKSPACE" ]; then
            npm run lint --workspace="$NPM_WORKSPACE"
          else
            npm run lint
          fi
